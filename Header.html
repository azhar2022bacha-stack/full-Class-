<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Website Header Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        /* Style the header container */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1a1a2e;
            color: #ffffff;
        }
        /* Style the logo */
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        /* Style the navigation menu */
        .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }
        .nav-menu a:hover {
            color: #40a9ff;
        }
    </style>
</head>
<body>

    <!-- The Semantic Header Section -->
    <header class="site-header">
        <div class="logo">MyBrand</div>
        <nav class="nav-menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

</body>
</html>
